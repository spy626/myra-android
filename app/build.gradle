plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.myra.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.myra.assistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-alpha01"
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
    sourceSets.main.assets.srcDir "$buildDir/generated/lyraAssets"
}

tasks.register('prepareLyraCharacter') {
    def chunksDir = file('src/main/lyra-model')
    def outputFile = file("$buildDir/generated/lyraAssets/models/lyra_elf_1k.glb")
    inputs.dir(chunksDir)
    outputs.file(outputFile)
    doLast {
        def chunks = chunksDir.listFiles()?.findAll { it.name.endsWith('.b64') }?.sort { it.name }
        if (!chunks) throw new GradleException('LYRA character model chunks are missing')
        outputFile.parentFile.mkdirs()
        def encoded = new StringBuilder()
        chunks.each { encoded.append(it.getText('UTF-8').trim()) }
        outputFile.bytes = java.util.Base64.decoder.decode(encoded.toString())
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(outputFile.bytes).encodeHex().toString()
        if (digest != '877c3d01fe9744cffb20e89df4a74515bcbcf1baa71bc510a5c1eaea9ef4b54e') {
            throw new GradleException('LYRA character model integrity check failed')
        }
    }
}

preBuild.dependsOn prepareLyraCharacter

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.filament:filament-android:1.75.0'
    implementation 'com.google.android.filament:gltfio-android:1.75.0'
    implementation 'com.google.android.filament:filament-utils-android:1.75.0'
    testImplementation 'junit:junit:4.13.2'
}
