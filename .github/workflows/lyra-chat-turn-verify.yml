name: LYRA Chat Turn Verify
on:
  push:
    branches: [agent/myra-phase-1]
    paths: [.github/workflows/lyra-chat-turn-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch and phone-recovery ancestor
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/myra-phase-1"
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply narrow turn-state and response checks
        run: |
          set -euo pipefail
          python3 tools/apply_chat_turn_frame.py
          git diff --check
      - name: Run full unit tests and build APK
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/chat-build.log" 2>&1 || {
            tail -n 240 "$RUNNER_TEMP/chat-build.log"; exit 1;
          }
          tail -n 95 "$RUNNER_TEMP/chat-build.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit only the tested source changes
        run: |
          set -euo pipefail
          git config user.name 'LYRA scoped CI verification'
          git config user.email 'lyra-ci@users.noreply.github.com'
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatGateway.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceActivity.kt \
            app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceChatNaturalConversationTest.kt
          git diff --cached --check
          git commit -m 'fix(chat): ground live casual turns and hold long disconnected replies'
          git push origin HEAD:refs/heads/agent/myra-phase-1
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-grounded-natural-chat-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
