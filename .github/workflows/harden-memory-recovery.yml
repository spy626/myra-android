name: Harden Memory Recovery

permissions:
  contents: write

on:
  push:
    branches: ['agent/myra-phase-1']

jobs:
  harden-memory-recovery:
    if: github.event.head_commit.message == 'Stage memory recovery hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/myra-phase-1
          fetch-depth: 0

      - name: Keep destructive entity recovery explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/myra/assistant/data/memory/AiriMemoryRuntime.kt')
          text = path.read_text()

          pattern = re.compile(
              r'if \(frame\.intent in setOf\(MemorySemanticIntent\.ADD_RELATIONSHIP,\s*'
              r'MemorySemanticIntent\.REMOVE_RELATIONSHIP,\s*'
              r'MemorySemanticIntent\.REPLACE_RELATIONSHIP,\s*'
              r'MemorySemanticIntent\.RENAME_ENTITY,\s*'
              r'MemorySemanticIntent\.DELETE_ENTITY,\s*'
              r'MemorySemanticIntent\.ADD_LINKED_FACT\) && frame\.person\.isNullOrBlank\(\)\) \{'
          )
          replacement = '''if (frame.intent in setOf(
                  MemorySemanticIntent.ADD_RELATIONSHIP,
                  MemorySemanticIntent.ADD_LINKED_FACT
              ) && frame.person.isNullOrBlank()) {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one entity-recovery block, replaced {count}; refusing unsafe edit')

          text = text.replace(
              '        // Best-effort person recovery for relationship/linked-fact/episode operations\n'
              '        // that are missing an explicit person — helpful, not a hard requirement below.',
              '        // Best-effort person recovery is limited to save-like operations. Destructive\n'
              '        // rename/delete/relationship changes must carry an explicit target from the\n'
              '        // structured proposal; never infer that target from another name in the turn.',
              1
          )
          path.write_text(text)
          PY

          rm -f .github/workflows/harden-memory-recovery.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden destructive memory entity recovery"
          git push origin HEAD:agent/myra-phase-1
