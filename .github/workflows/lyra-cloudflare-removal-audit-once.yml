name: LYRA Cloudflare Removal Audit One-Off
on:
  push:
    branches: [agent/myra-phase-1]
    paths: ['.github/workflows/lyra-cloudflare-removal-audit-once.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Cloudflare references without modifying source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          echo '=== MAIN SOURCE REFERENCES ==='
          rg -n -i 'cloudflare|CLOUDFLARE' app/src/main || true
          echo '=== TEST FILE REFERENCES ==='
          rg -l -i 'cloudflare|CLOUDFLARE' app/src/test app/src/androidTest || true
          echo '=== OTHER TRACKED FILE REFERENCES ==='
          git grep -l -i 'cloudflare' -- ':!app/src/main/**' ':!app/src/test/**' ':!app/src/androidTest/**' ':!.github/workflows/lyra-cloudflare-removal-audit-once.yml' || true
          echo '=== CODE BASE COUNTS ==='
          rg -l -i 'cloudflare' app/src/main | wc -l
          rg -l -i 'cloudflare' app/src/test app/src/androidTest | wc -l
