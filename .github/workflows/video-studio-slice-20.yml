name: Video Studio Slice 20 Offline Storyboard Contract

on:
  push:
    branches: ['agent/lyra-video-studio-slice-20']
    paths:
      - 'tools/video_studio/storyboard_plan.py'
      - 'tools/video_studio/test_storyboard_plan.py'
      - 'tools/video_studio/SLICE_20.md'
      - '.github/workflows/video-studio-slice-20.yml'
  pull_request:
    branches: ['agent/lyra-video-studio-slice-19']

permissions:
  contents: read

jobs:
  storyboard-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline storyboard and inherited Python contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/video_studio -p 'test_*.py' -v
          python3 tools/video_studio/storyboard_plan.py --request tools/video_studio/requests/sample-blue-house.json --output "$RUNNER_TEMP/lyra-storyboard.json"
          python3 - "$RUNNER_TEMP/lyra-storyboard.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['mode']=='offline_storyboard_plan_only'
          assert not p['video_rendered'] and not p['staging_deployed'] and not p['workflow_dispatched']
          assert p['planned_frames']==p['target_duration_seconds']*12
          print('PASS: offline timeline only')
          PY
      - name: Retain inherited Node video security tests
        run: node --test connector-broker/test/video-*.test.mjs
      - name: Ensure production and staging disabled config untouched
        run: |
          set -euo pipefail
          git diff --exit-code HEAD^ HEAD -- connector-broker/src/index.js connector-broker/wrangler.toml connector-broker/wrangler.video-auth.example.toml
          grep -F 'VIDEO_AUTH_ENABLED = "false"' connector-broker/wrangler.video-auth.example.toml
          grep -F 'VIDEO_AUTH_DEPLOYMENT_APPROVED = "false"' connector-broker/wrangler.video-auth.example.toml
