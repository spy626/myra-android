name: Video Studio Slice 21 Real Foundation Shot Gate

on:
  push:
    branches: ['agent/lyra-video-studio-slice-21']
    paths:
      - 'tools/video_studio/**'
      - '.github/workflows/video-studio-slice-21.yml'
  pull_request:
    branches: ['agent/lyra-video-studio-slice-20']

permissions:
  contents: read

jobs:
  real-foundation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GH_TOKEN: ''
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline contract, inherited regressions and disabled staging
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/video_studio -p 'test_*.py' -v
          node --test connector-broker/test/video-*.test.mjs
          python3 tools/video_studio/check_staging_readiness.py
          git diff --exit-code b2d99e86535d5dca8f7e8eee93814b20934dad4b HEAD -- \
            connector-broker/src/index.js connector-broker/wrangler.toml \
            connector-broker/wrangler.video-auth.example.toml \
            tools/video_studio/mini_house_blender.py
      - name: Install free Blender/FFmpeg software renderer on CI only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libopengl0 xvfb xauth
          blender --version | head -n 2
      - name: Render first NEW construction foundation shot (not whole storyboard)
        run: |
          set -euo pipefail
          mkdir -p build/video-studio/slice21/frames
          timeout 900 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_foundation_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json \
            --output-dir build/video-studio/slice21
      - name: Encode genuine 72 Blender frames and verify MP4
        run: |
          set -euo pipefail
          output=build/video-studio/slice21
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -start_number 1 \
            -i "$output/frames/foundation_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$output/foundation_shot_6s.mp4"
          python3 tools/video_studio/verify_foundation_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$output"
      - name: Export 3-frame contact sheet for manual quality review
        run: |
          set -euo pipefail
          output=build/video-studio/slice21
          ffmpeg -hide_banner -loglevel error -y -i "$output/foundation_shot_6s.mp4" \
            -vf "select='eq(n,0)+eq(n,35)+eq(n,71)',scale=180:320,tile=3x1" \
            -frames:v 1 "$output/foundation_contact_sheet.png"
          test -s "$output/foundation_contact_sheet.png"
      - name: Upload offline video, actual Blender source and evidence ONLY
        uses: actions/upload-artifact@v4
        with:
          name: lyra-slice21-real-foundation-6s-proof
          path: |
            build/video-studio/slice21/foundation_shot_6s.mp4
            build/video-studio/slice21/foundation_scene.blend
            build/video-studio/slice21/foundation_manifest.json
            build/video-studio/slice21/foundation_contact_sheet.png
          retention-days: 7
          if-no-files-found: error
