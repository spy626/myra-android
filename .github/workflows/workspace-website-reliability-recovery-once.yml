name: One-time website phone recovery
on:
  push:
    branches: [agent/myra-phase-1]
    paths: [.github/workflows/workspace-website-reliability-recovery-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'spy626/myra-android' && github.ref == 'refs/heads/agent/myra-phase-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify exact branch and stage narrowly scoped patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/myra-phase-1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/myra-phase-1)"
          python3 -m py_compile scripts/workspace_website_reliability_recovery_once.py
          python3 scripts/workspace_website_reliability_recovery_once.py
          git diff --check
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatCodingFlow.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteGeneration.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteGroqFallback.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteRecoveryTest.kt
          test -n "$(git diff --cached --name-only)"
      - name: Unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Fast-forward branch only after green tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/myra-phase-1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/myra-phase-1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workspace): recover Groq 400 once and omit unverified images'
          git push origin HEAD:agent/myra-phase-1
