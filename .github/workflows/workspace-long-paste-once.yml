name: One-time Workspace long-paste source patch
on:
  push:
    branches: ['agent/myra-phase-1']
    paths: ['.github/workflows/workspace-long-paste-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'spy626/myra-android' && github.ref == 'refs/heads/agent/myra-phase-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify source and apply audited anchored replacements
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/myra-phase-1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/myra-phase-1)"
          python3 scripts/workspace_long_paste_once.py
          git diff --check
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceActivity.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceConversationStore.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceLongInputPolicy.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatGateway.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceLongInputPolicyTest.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceChatGatewayTest.kt
          git diff --cached --stat
          git diff --cached --quiet && { echo 'Expected source changes missing' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workspace): preserve full long pasted messages and bounded provider payloads'
          git push origin HEAD:agent/myra-phase-1
