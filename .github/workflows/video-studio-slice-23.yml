name: Video Studio Slice 23 Real 12s Construction Sequence Gate

on:
  push:
    branches: ['agent/lyra-video-studio-slice-23']
    paths:
      - 'tools/video_studio/**'
      - '.github/workflows/video-studio-slice-23.yml'
  pull_request:
    branches: ['agent/lyra-video-studio-slice-22']

permissions:
  contents: read

jobs:
  real-twelve-second-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GH_TOKEN: ''
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 18
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict 12s contract and all inherited offline tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/video_studio -p 'test_*.py' -v
          node --test connector-broker/test/video-*.test.mjs
          python3 tools/video_studio/check_staging_readiness.py
          git diff --exit-code 17c743711b26733f410459675bafbf9f42219f71 HEAD -- \
            connector-broker/src/index.js connector-broker/wrangler.toml \
            connector-broker/wrangler.video-auth.example.toml \
            tools/video_studio/mini_house_blender.py \
            tools/video_studio/render_foundation_shot_blender.py \
            tools/video_studio/render_structure_shot_blender.py
      - name: Install no-cost local Blender and FFmpeg render executables
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            blender ffmpeg libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libopengl0 xvfb xauth
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Render actual foundation construction (72 NEW PNG frames)
        run: |
          set -euo pipefail
          output=build/video-studio/slice23/foundation
          mkdir -p "$output/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_foundation_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$output"
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -start_number 1 \
            -i "$output/frames/foundation_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$output/foundation_shot_6s.mp4"
          python3 tools/video_studio/verify_foundation_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$output"
      - name: Render actual rising structure (72 OTHER PNG frames)
        run: |
          set -euo pipefail
          output=build/video-studio/slice23/structure
          mkdir -p "$output/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_structure_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$output"
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -start_number 1 \
            -i "$output/frames/structure_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$output/structure_shot_6s.mp4"
          python3 tools/video_studio/verify_structure_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$output"
      - name: Encode a real 12s MP4 and compare ALL decoded frames against sources
        run: |
          set -euo pipefail
          root=build/video-studio/slice23
          python3 tools/video_studio/assemble_construction_sequence.py \
            --request tools/video_studio/requests/sample-blue-house.json \
            --foundation-dir "$root/foundation" \
            --structure-dir "$root/structure" \
            --output-dir "$root/sequence"
          ffmpeg -hide_banner -loglevel error -y -i "$root/sequence/construction_sequence_12s.mp4" \
            -vf "select='eq(n,0)+eq(n,71)+eq(n,72)+eq(n,143)',scale=180:320,tile=4x1" \
            -frames:v 1 "$root/sequence/construction_sequence_contact_sheet.png"
          test -s "$root/sequence/construction_sequence_contact_sheet.png"
      - name: Preserve offline 12s MP4 and metadata for owner visual review
        uses: actions/upload-artifact@v4
        with:
          name: lyra-slice23-real-two-shot-construction-12s
          path: |
            build/video-studio/slice23/sequence/construction_sequence_12s.mp4
            build/video-studio/slice23/sequence/construction_sequence_manifest.json
            build/video-studio/slice23/sequence/construction_sequence_contact_sheet.png
            build/video-studio/slice23/foundation/foundation_manifest.json
            build/video-studio/slice23/structure/structure_manifest.json
          if-no-files-found: error
          retention-days: 7
