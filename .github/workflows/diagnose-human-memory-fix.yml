name: Diagnose human memory fix
permissions:
  contents: write
on:
  push:
    branches: ['agent/myra-phase-1']
    paths: ['.github/workflows/diagnose-human-memory-fix.yml']

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/myra-phase-1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reapply staged source patch
        run: |
          python3 <<'EXTRACT'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-human-memory-fix.yml').read_text()
          marker = "python3 <<'PY'\n"
          block = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          block = textwrap.dedent(block)
          exec(compile(block, '<human-memory-patch>', 'exec'))
          EXTRACT
      - name: Compile test and capture diagnostics
        id: gradle
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/memory-build.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 450 "$RUNNER_TEMP/memory-build.log" > .ci-memory-error.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostics when failed
        if: steps.gradle.outputs.failed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-memory-error.txt
          git commit -m 'Capture human memory fix compile error'
          git push origin HEAD:agent/myra-phase-1
          exit 1
      - name: Commit verified production fix
        if: steps.gradle.outputs.failed == 'false'
        run: |
          rm -f .github/workflows/apply-human-memory-fix.yml .github/workflows/diagnose-human-memory-fix.yml .ci-memory-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java .github/workflows .ci-memory-error.txt || true
          git commit -m 'Make memory context-aware entity-scoped and low-latency'
          git push origin HEAD:agent/myra-phase-1
