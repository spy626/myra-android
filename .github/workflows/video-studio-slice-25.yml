name: Video Studio Slice 25 Real Original 30s Five-Shot Gate

on:
  push:
    branches: ['agent/lyra-video-studio-slice-25']
    paths:
      - 'tools/video_studio/**'
      - '.github/workflows/video-studio-slice-25.yml'
  pull_request:
    branches: ['agent/lyra-video-studio-slice-24']

permissions:
  contents: read

jobs:
  real-thirty-second-video:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GH_TOKEN: ''
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve inherited offline security tests and unchanged LYRA renderers
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/video_studio -p 'test_*.py' -v
          node --test connector-broker/test/video-*.test.mjs
          python3 tools/video_studio/check_staging_readiness.py
          git diff --exit-code 3258b39b30a0f8ea3dfbe6461f9358fdf2388eee HEAD -- \
            connector-broker/src/index.js connector-broker/wrangler.toml \
            connector-broker/wrangler.video-auth.example.toml \
            tools/video_studio/mini_house_blender.py \
            tools/video_studio/render_foundation_shot_blender.py \
            tools/video_studio/render_structure_shot_blender.py \
            tools/video_studio/render_facade_shot_blender.py \
            tools/video_studio/assemble_construction_sequence.py \
            tools/video_studio/assemble_three_shot_sequence.py
      - name: Install free offline Blender and FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            blender ffmpeg libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libopengl0 xvfb xauth
          blender --version | head -n 2
      - name: Render NEW site survey and lot preparation scene
        run: |
          set -euo pipefail
          o=build/video-studio/slice25/lot
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_edge_shot_blender.py \
            -- --scene lot --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/lot_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/lot_shot_6s.mp4"
          python3 tools/video_studio/verify_edge_shot.py \
            --scene lot --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
      - name: Render actual original foundation shot
        run: |
          set -euo pipefail
          o=build/video-studio/slice25/foundation
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_foundation_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/foundation_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/foundation_shot_6s.mp4"
          python3 tools/video_studio/verify_foundation_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$o"
      - name: Render actual original structure shot
        run: |
          set -euo pipefail
          o=build/video-studio/slice25/structure
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_structure_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/structure_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/structure_shot_6s.mp4"
          python3 tools/video_studio/verify_structure_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$o"
      - name: Render actual original roof and facade shot
        run: |
          set -euo pipefail
          o=build/video-studio/slice25/facade
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_facade_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/facade_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/facade_shot_6s.mp4"
          python3 tools/video_studio/verify_facade_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$o"
      - name: Render NEW finished-house reveal and exterior finishing scene
        run: |
          set -euo pipefail
          o=build/video-studio/slice25/reveal
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_edge_shot_blender.py \
            -- --scene reveal --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/reveal_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/reveal_shot_6s.mp4"
          python3 tools/video_studio/verify_edge_shot.py \
            --scene reveal --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
      - name: Assemble 30s H264, verify all 360 decoded frames and contact sheet
        run: |
          set -euo pipefail
          base=build/video-studio/slice25
          python3 tools/video_studio/assemble_five_shot_sequence.py \
            --request tools/video_studio/requests/sample-blue-house.json \
            --lot-dir "$base/lot" --foundation-dir "$base/foundation" \
            --structure-dir "$base/structure" --facade-dir "$base/facade" \
            --reveal-dir "$base/reveal" --output-dir "$base/sequence"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "$base/sequence/construction_sequence_30s.mp4" \
            -vf "select='eq(n,0)+eq(n,71)+eq(n,72)+eq(n,143)+eq(n,144)+eq(n,215)+eq(n,216)+eq(n,287)+eq(n,288)+eq(n,359)',scale=180:320,tile=10x1" \
            -frames:v 1 "$base/sequence/construction_sequence_contact_sheet.png"
          test -s "$base/sequence/construction_sequence_contact_sheet.png"
      - name: Upload authentic 30s video and NEW Blender scenes
        uses: actions/upload-artifact@v4
        with:
          name: lyra-slice25-real-five-shot-construction-30s
          path: |
            build/video-studio/slice25/sequence/construction_sequence_30s.mp4
            build/video-studio/slice25/sequence/construction_sequence_30s_manifest.json
            build/video-studio/slice25/sequence/construction_sequence_contact_sheet.png
            build/video-studio/slice25/lot/lot_scene.blend
            build/video-studio/slice25/lot/lot_shot_6s.mp4
            build/video-studio/slice25/lot/lot_manifest.json
            build/video-studio/slice25/reveal/reveal_scene.blend
            build/video-studio/slice25/reveal/reveal_shot_6s.mp4
            build/video-studio/slice25/reveal/reveal_manifest.json
          if-no-files-found: error
          retention-days: 7
