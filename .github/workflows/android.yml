# Recovery retry after repository Actions permissions reset.
name: Build Android APK
permissions:
  contents: write
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure stable APK signing when secrets exist
        env:
          LYRA_KEYSTORE_BASE64: ${{ secrets.LYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYRA_KEYSTORE_BASE64" ]; then
            echo "$LYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyra-ci.jks"
          else
            echo "Stable signing secrets are absent; debug output will use the isolated com.myra.assistant.phonetest package."
          fi
      - name: Android lint (legacy findings are reported separately)
        continue-on-error: true
        timeout-minutes: 8
        run: gradle :app:lintDebug --stacktrace --no-daemon
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/gradle-build.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 500 "$RUNNER_TEMP/gradle-build.log"
            exit "$status"
          fi
          tail -n 80 "$RUNNER_TEMP/gradle-build.log"
        env:
          LYRA_KEYSTORE_PATH: ${{ runner.temp }}/lyra-ci.jks
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}

      # AGP may legitimately omit v1 signing for minSdk 26 even when the signing
      # config requests it. Some Android file managers still reject such APKs
      # before handing them to Package Installer, so normalize the test APK with
      # apksigner explicitly. Never publish unless the result verifies afterwards.
      - name: Normalize phone-test APK signatures
        shell: bash
        env:
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          if [ -s "$RUNNER_TEMP/lyra-ci.jks" ] &&
             [ -n "$LYRA_KEYSTORE_PASSWORD" ] &&
             [ -n "$LYRA_KEY_ALIAS" ] &&
             [ -n "$LYRA_KEY_PASSWORD" ]; then
            ks="$RUNNER_TEMP/lyra-ci.jks"
            alias="$LYRA_KEY_ALIAS"
            store_pass="$LYRA_KEYSTORE_PASSWORD"
            key_pass="$LYRA_KEY_PASSWORD"
            echo "Re-signing isolated phone-test APK with configured stable key."
          else
            # Do not assume AGP materialized ~/.android/debug.keystore on a hosted
            # runner. Generate an explicit test-only signer for this isolated app.
            ks="$RUNNER_TEMP/lyra-phone-test.jks"
            alias="lyraphonetest"
            store_pass="lyra-phone-test"
            key_pass="lyra-phone-test"
            rm -f "$ks"
            keytool -genkeypair -noprompt \
              -keystore "$ks" \
              -storetype JKS \
              -storepass "$store_pass" \
              -keypass "$key_pass" \
              -alias "$alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=LYRA Phone Test,O=Android,C=US"
            echo "Re-signing isolated phone-test APK with an explicit test-only key."
          fi
          test -s "$ks"

          "$apksigner" sign             --ks "$ks"             --ks-key-alias "$alias"             --ks-pass "pass:$store_pass"             --key-pass "pass:$key_pass"             --min-sdk-version 21             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --v4-signing-enabled false             --out "$RUNNER_TEMP/lyra-phone-test-signed.apk"             "$apk"

          mv "$RUNNER_TEMP/lyra-phone-test-signed.apk" "$apk"

      - name: Verify phone-test APK identity and signatures
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"

          "$apksigner" verify --min-sdk-version 21 --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -F "Verified using v1 scheme (JAR signing): true" "$RUNNER_TEMP/apksigner.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apksigner.txt"

          "$aapt" dump badging "$apk" | head -n 1 | tee "$RUNNER_TEMP/apk-package.txt"
          grep -F "package: name='com.myra.assistant.phonetest'" "$RUNNER_TEMP/apk-package.txt"

          echo "Phone-test APK has isolated package identity and verified v1/v2/v3 signatures."

      - uses: actions/upload-artifact@v4
        with:
          name: lyra-phone-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct phone-test APK prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/myra-phase-1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="airi-memory-${COMMIT_SHA:0:12}"
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          if response=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/releases/tags/$tag"); then
            :
          else
            response=$(curl --fail-with-body --silent --show-error "${auth[@]}"               -X POST "$api/releases"               -d "{\"tag_name\":\"$tag\",\"target_commitish\":\"$COMMIT_SHA\",\"name\":\"LYRA Phone Test $tag\",\"body\":\"Isolated com.myra.assistant.phonetest debug APK for physical Android acceptance. Existing LYRA is not replaced. APK is CI-verified for v1/v2/v3 signatures. PHONE PASS is not claimed.\",\"draft\":false,\"prerelease\":true}")
          fi
          release_id=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          upload_url=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')

          uploaded=false
          for attempt in 1 2 3; do
            assets=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/releases/$release_id/assets")
            asset_id=$(printf '%s' "$assets" | python3 -c 'import json,sys; xs=json.load(sys.stdin); print(next((x["id"] for x in xs if x.get("name")=="lyra-phone-test.apk"), ""))')
            if [ -n "$asset_id" ]; then
              curl --fail-with-body --silent --show-error "${auth[@]}" -X DELETE "$api/releases/assets/$asset_id"
            fi
            if curl --fail-with-body --silent --show-error --max-time 600               -o /dev/null -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Content-Type: application/vnd.android.package-archive"               --data-binary @app/build/outputs/apk/debug/app-debug.apk               "$upload_url?name=lyra-phone-test.apk"; then
              uploaded=true
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$uploaded" != true ]; then
            echo "APK release upload failed after bounded retries" >&2
            exit 1
          fi
