# Recovery retry after repository Actions permissions reset.
name: Build Android APK
permissions:
  contents: write
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure stable APK signing when secrets exist
        env:
          LYRA_KEYSTORE_BASE64: ${{ secrets.LYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYRA_KEYSTORE_BASE64" ]; then
            echo "$LYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyra-ci.jks"
          fi
      - name: Android lint (legacy findings are reported separately)
        continue-on-error: true
        timeout-minutes: 8
        run: gradle :app:lintDebug --stacktrace --no-daemon
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/gradle-build.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 500 "$RUNNER_TEMP/gradle-build.log"
            exit "$status"
          fi
          tail -n 80 "$RUNNER_TEMP/gradle-build.log"
        env:
          LYRA_KEYSTORE_PATH: ${{ runner.temp }}/lyra-ci.jks
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct debug APK prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/myra-phase-1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="airi-memory-${COMMIT_SHA:0:12}"
          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/releases" \
            -d "{\"tag_name\":\"$tag\",\"target_commitish\":\"$COMMIT_SHA\",\"name\":\"LYRA AIRI Memory $tag\",\"body\":\"Automated debug APK for physical Android acceptance. PHONE PASS is not claimed.\",\"draft\":false,\"prerelease\":true}")
          upload_url=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
          curl --fail-with-body --silent --show-error \
            -o /dev/null \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @app/build/outputs/apk/debug/app-debug.apk \
            "$upload_url?name=app-debug.apk"
