# Recovery retry after repository Actions permissions reset.
name: Build Android APK
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure stable APK signing when secrets exist
        env:
          LYRA_KEYSTORE_BASE64: ${{ secrets.LYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYRA_KEYSTORE_BASE64" ]; then
            echo "$LYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyra-ci.jks"
          fi
      - name: Apply focused audio ownership and article-container fixes
        if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[focused-fixes-applied]') }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/src/main/java/com/myra/assistant/ai/AudioEngine.kt')
          s=p.read_text()
          if 'private data class AudioChunk' not in s:
              s=s.replace('private val queue = LinkedBlockingQueue<ByteArray>()', '''private data class AudioChunk(val generationId: Long, val playbackId: Long, val bytes: ByteArray)
    private val queue = LinkedBlockingQueue<AudioChunk>()''')
              s=s.replace('@Volatile private var playbackReferenceRms = 0f', '''@Volatile private var playbackReferenceRms = 0f
    @Volatile private var activePlaybackId = 0L
    private var playbackSequence = 0L''')
              s=s.replace('''                val bytes = queue.poll(SPEECH_END_GRACE_MS, TimeUnit.MILLISECONDS)
                if (!running.get()) break
                if (bytes == null) {''','''                val chunk = queue.poll(SPEECH_END_GRACE_MS, TimeUnit.MILLISECONDS)
                if (!running.get()) break
                if (chunk == null) {''')
              s=s.replace('''                synchronized(playbackLock) {
                    if (!running.get()) return@synchronized
                    runCatching {''','''                if (chunk.generationId != playbackGeneration) {
                    voiceLog("DUPLICATE_AUDIO_BLOCKED playbackId=${chunk.playbackId} chunkGeneration=${chunk.generationId} activeGeneration=$playbackGeneration reason=stale_generation")
                    continue
                }
                synchronized(playbackLock) {
                    if (!running.get()) return@synchronized
                    if (chunk.generationId != playbackGeneration) {
                        voiceLog("DUPLICATE_AUDIO_BLOCKED playbackId=${chunk.playbackId} reason=generation_changed_before_write")
                        return@synchronized
                    }
                    runCatching {''')
              s=s.replace('''                                "playback_start bytes=${bytes.size} queued=${queue.size} " +''','''                                "playback_start playbackId=${chunk.playbackId} generationId=${chunk.generationId} bytes=${chunk.bytes.size} queued=${queue.size} " +''')
              s=s.replace('''                        val written = track?.write(bytes, 0, bytes.size, AudioTrack.WRITE_BLOCKING) ?: 0
                        playbackReferenceRms = rms(bytes)''','''                        activePlaybackId = chunk.playbackId
                        val written = track?.write(chunk.bytes, 0, chunk.bytes.size, AudioTrack.WRITE_BLOCKING) ?: 0
                        playbackReferenceRms = rms(chunk.bytes)''')
              s=s.replace('''                            "audio_track_write requested=${bytes.size} written=$written " +''','''                            "audio_track_write playbackId=${chunk.playbackId} generationId=${chunk.generationId} requested=${chunk.bytes.size} written=$written " +''')
              old='''    fun queueAudio(bytes: ByteArray) {
        val accepted = queue.offer(bytes)
        voiceLog(
            "playback_queued seq=${++queuedAudioChunk} bytes=${bytes.size} " +
                "accepted=$accepted queueSize=${queue.size} running=${running.get()}"
        )
    }
    fun setPlaybackContext(generationId: Long, screenQueryId: String = "", responseOwner: String = "MODEL") {
        playbackGeneration = generationId
        playbackScreenQueryId = screenQueryId
        playbackResponseOwner = responseOwner
    }'''
              new='''    fun queueAudio(bytes: ByteArray) {
        val generation = playbackGeneration
        val playbackId = ++playbackSequence
        val accepted = queue.offer(AudioChunk(generation, playbackId, bytes.copyOf()))
        voiceLog("playback_queued playbackId=$playbackId generationId=$generation seq=${++queuedAudioChunk} bytes=${bytes.size} accepted=$accepted queueSize=${queue.size} activePlaybackId=$activePlaybackId running=${running.get()}")
    }
    fun setPlaybackContext(generationId: Long, screenQueryId: String = "", responseOwner: String = "MODEL") {
        val previous = playbackGeneration
        if (previous != 0L && generationId != 0L && previous != generationId) cancelPlayback("new_generation", generationId)
        playbackGeneration = generationId
        playbackScreenQueryId = screenQueryId
        playbackResponseOwner = responseOwner
        voiceLog("audio_owner_changed generationId=$generationId previousGeneration=$previous owner=$responseOwner screenQueryId=$screenQueryId")
    }
    private fun cancelPlayback(reason: String, replacementGenerationId: Long = 0L) {
        val cancelledId = activePlaybackId
        queue.clear()
        playbackGeneration = replacementGenerationId
        synchronized(playbackLock) {
            runCatching { track?.pause() }
            runCatching { track?.flush() }
        }
        speaking.set(false)
        bargeInEnabled.set(false)
        audioFocus.abandon(reason)
        voiceLog("AUDIO_PLAYBACK_CANCELLED playbackId=$cancelledId replacementGenerationId=$replacementGenerationId reason=$reason activeAudioOwner=$playbackResponseOwner")
        onSpeakingChanged?.invoke(false)
    }'''
              if old not in s: raise SystemExit('AudioEngine queue/context block not found')
              s=s.replace(old,new)
              s=s.replace('''        voiceLog("playback_interrupt queueSize=${queue.size} speaking=${speaking.get()}")
        queue.clear()''','''        voiceLog("playback_interrupt queueSize=${queue.size} speaking=${speaking.get()} activePlaybackId=$activePlaybackId generationId=$playbackGeneration")
        queue.clear()''')
              s=s.replace('''        playbackGeneration = 0L
        playbackScreenQueryId = ""''','''        playbackGeneration = 0L
        activePlaybackId = 0L
        playbackScreenQueryId = ""''')
              s=s.replace('''        queue.offer(ByteArray(0))''','''        queue.offer(AudioChunk(playbackGeneration, ++playbackSequence, ByteArray(0)))''')
              p.write_text(s)

          p=Path('app/src/main/java/com/myra/assistant/service/AccessibilityHelperService.kt')
          s=p.read_text()
          if 'fun currentArticleScrollContainerId()' not in s:
              marker='''    /** Generic adaptive article scroll. It is hard-blocked for video/social surfaces. */
    fun scrollArticleVerified(onResult: (Boolean) -> Unit): Boolean {'''
              replacement='''    fun currentArticleScrollContainerId(): String? {
        if (detectContentType() != com.myra.assistant.screen.ScreenContentType.ARTICLE) return null
        val root = rootInActiveWindow ?: return null
        val screenWidth = resources.displayMetrics.widthPixels
        val screenHeight = resources.displayMetrics.heightPixels
        val candidates = mutableListOf<Pair<Int, AccessibilityNodeInfo>>()
        fun collect(node: AccessibilityNodeInfo) {
            if (node.isVisibleToUser && node.isScrollable) {
                val bounds = Rect().also(node::getBoundsInScreen)
                if (bounds.width() >= screenWidth * 0.55 && bounds.height() >= screenHeight * 0.35) candidates += bounds.width() * bounds.height() to node
            }
            for (index in 0 until node.childCount) node.getChild(index)?.let(::collect)
        }
        collect(root)
        val node = candidates.maxByOrNull { it.first }?.second ?: return null
        val viewId = node.viewIdResourceName?.toString().orEmpty()
        val className = node.className?.toString().orEmpty()
        return listOf(root.packageName?.toString().orEmpty(), viewId, className).joinToString("|").takeIf { it != "||" }
    }

    /** Generic adaptive article scroll. It is hard-blocked for video/social surfaces. */
    fun scrollArticleVerified(expectedContainerId: String? = null, onResult: (Boolean) -> Unit): Boolean {'''
              if marker not in s: raise SystemExit('scroll marker not found')
              s=s.replace(marker,replacement)
              old='''        if (detectContentType() != com.myra.assistant.screen.ScreenContentType.ARTICLE) return false
        val before = visibleScreenSignature()
        val root = rootInActiveWindow ?: return false'''
              new='''        if (detectContentType() != com.myra.assistant.screen.ScreenContentType.ARTICLE) return false
        val currentContainerId = currentArticleScrollContainerId() ?: return false
        if (expectedContainerId.isNullOrBlank() || currentContainerId != expectedContainerId) return false
        val before = visibleScreenSignature()
        val root = rootInActiveWindow ?: return false'''
              if old not in s: raise SystemExit('article scroll preamble not found')
              s=s.replace(old,new,1)
              p.write_text(s)

          p=Path('app/src/main/java/com/myra/assistant/service/MyraVoiceService.kt')
          s=p.read_text()
          if 'currentArticleScrollContainerId()' not in s:
              old='''        val context = com.myra.assistant.screen.ScreenContextStore.snapshot()
        val identity = listOfNotNull(context.currentPackage, accessibility.visibleArticleText().firstOrNull())
            .joinToString(":").take(300)
        val session = readingTracker.start(
            ScreenCaptureService.session.sessionId, identity,
            accessibility.currentPackageName().orEmpty(), contentType, explicitlyRequested = true
        ) ?: run {'''
              new='''        val context = com.myra.assistant.screen.ScreenContextStore.snapshot()
        val identity = listOfNotNull(context.currentPackage, accessibility.visibleArticleText().firstOrNull())
            .joinToString(":").take(300)
        val containerId = accessibility.currentArticleScrollContainerId()
        if (containerId.isNullOrBlank()) {
            voiceLog("ARTICLE_SCROLL_REJECTED turnId=$turnId reason=no_article_scroll_container")
            speakReadingStatus("Article ka safe scroll area nahi mila.", error = true)
            return
        }
        val session = readingTracker.start(
            ScreenCaptureService.session.sessionId, identity,
            accessibility.currentPackageName().orEmpty(), contentType, explicitlyRequested = true,
            scrollContainerId = containerId
        ) ?: run {'''
              if old not in s: raise SystemExit('reading start block not found')
              s=s.replace(old,new)
              old2='''        val accessibility = AccessibilityHelperService.instance ?: run { finishArticleAtEnd(); return }
        voiceLog(
            "READING_AUTO_SCROLL_STARTED reading_session_id=${session.readingSessionId} " +'''
              new2='''        val accessibility = AccessibilityHelperService.instance ?: run { finishArticleAtEnd(); return }
        val boundContainerId = session.scrollContainerId
        val currentContainerId = accessibility.currentArticleScrollContainerId()
        if (boundContainerId.isNullOrBlank() || currentContainerId != boundContainerId ||
            !readingTracker.acceptsScrollContainer(currentContainerId, ScreenCaptureService.session.sessionId, foregroundPackage)) {
            pendingActionAfterLocalSpeech = null
            voiceLog("ARTICLE_SCROLL_REJECTED reading_session_id=${session.readingSessionId} reason=container_mismatch bound=$boundContainerId current=$currentContainerId package=$foregroundPackage")
            readingTracker.pause()
            return
        }
        voiceLog(
            "READING_AUTO_SCROLL_STARTED reading_session_id=${session.readingSessionId} " +'''
              if old2 not in s: raise SystemExit('auto scroll preamble not found')
              s=s.replace(old2,new2)
              s=s.replace('''        val accepted = accessibility.scrollArticleVerified { changed ->''','''        val accepted = accessibility.scrollArticleVerified(boundContainerId) { changed ->''')
              p.write_text(s)

          test=Path('app/src/test/java/com/myra/assistant/screen/FocusedPhoneFixesTest.kt')
          if not test.exists():
              test.parent.mkdir(parents=True, exist_ok=True)
              test.write_text('''package com.myra.assistant.screen\n\nimport org.junit.Assert.*\nimport org.junit.Test\n\nclass FocusedPhoneFixesTest {\n    @Test fun articleSessionBindsContainer() {\n        val tracker = ReadingTracker()\n        val session = tracker.start("screen-1", "page", "com.android.chrome", ScreenContentType.ARTICLE, true, scrollContainerId = "com.android.chrome|content|android.webkit.WebView")\n        assertNotNull(session)\n        assertTrue(tracker.acceptsScrollContainer("com.android.chrome|content|android.webkit.WebView", "screen-1", "com.android.chrome"))\n        assertFalse(tracker.acceptsScrollContainer("com.google.android.youtube|content|android.webkit.WebView", "screen-1", "com.android.chrome"))\n    }\n\n    @Test fun youtubeCannotUseArticleSession() {\n        val tracker = ReadingTracker()\n        assertNull(tracker.start("screen-1", "page", "com.google.android.youtube", ScreenContentType.VIDEO_PLATFORM, true, scrollContainerId = "youtube|content|WebView"))\n    }\n\n    @Test fun staleReadingSessionCannotAcceptNewScreenSession() {\n        val tracker = ReadingTracker()\n        tracker.start("screen-1", "page", "com.android.chrome", ScreenContentType.ARTICLE, true, scrollContainerId = "chrome|content|WebView")\n        assertFalse(tracker.acceptsScrollContainer("chrome|content|WebView", "screen-2", "com.android.chrome"))\n    }\n\n    @Test fun duplicateArticleContentIsSkipped() {\n        val tracker = ReadingTracker()\n        tracker.start("screen-1", "page", "com.android.chrome", ScreenContentType.ARTICLE, true, scrollContainerId = "chrome|content|WebView")\n        val first = tracker.acceptVisibleText(listOf("This is a sufficiently long article paragraph that should be read once."), 1L)\n        val second = tracker.acceptVisibleText(listOf("This is a sufficiently long article paragraph that should be read once."), 2L)\n        assertEquals(1, first.size)\n        assertTrue(second.isEmpty())\n    }\n}\n''')
          PY
      - name: Android lint (legacy findings are reported separately)
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
        env:
          LYRA_KEYSTORE_PATH: ${{ runner.temp }}/lyra-ci.jks
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}
      - name: Commit focused source changes
        if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[focused-fixes-applied]') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myra/assistant/ai/AudioEngine.kt app/src/main/java/com/myra/assistant/service/AccessibilityHelperService.kt app/src/main/java/com/myra/assistant/service/MyraVoiceService.kt app/src/test/java/com/myra/assistant/screen/FocusedPhoneFixesTest.kt .github/workflows/android.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix audio ownership and article scroll safety [focused-fixes-applied]"
          git push origin HEAD:agent/myra-phase-1
      - uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
