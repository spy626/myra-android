# Recovery retry after repository Actions permissions reset.
name: Build Android APK
permissions:
  contents: write
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure stable APK signing when secrets exist
        env:
          LYRA_KEYSTORE_BASE64: ${{ secrets.LYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYRA_KEYSTORE_BASE64" ]; then
            echo "$LYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyra-ci.jks"
          fi
      - name: Android lint (legacy findings are reported separately)
        continue-on-error: true
        timeout-minutes: 8
        run: gradle :app:lintDebug --stacktrace --no-daemon
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/gradle-build.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 500 "$RUNNER_TEMP/gradle-build.log"
            exit "$status"
          fi
          tail -n 80 "$RUNNER_TEMP/gradle-build.log"
        env:
          LYRA_KEYSTORE_PATH: ${{ runner.temp }}/lyra-ci.jks
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct debug APK prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/myra-phase-1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="airi-memory-${COMMIT_SHA:0:12}"
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          # Re-running this step must be safe: reuse the release when it already exists.
          if response=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/releases/tags/$tag"); then
            :
          else
            response=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
              -X POST "$api/releases" \
              -d "{\"tag_name\":\"$tag\",\"target_commitish\":\"$COMMIT_SHA\",\"name\":\"LYRA AIRI Memory $tag\",\"body\":\"Automated debug APK for physical Android acceptance. PHONE PASS is not claimed.\",\"draft\":false,\"prerelease\":true}")
          fi
          release_id=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          upload_url=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')

          # GitHub occasionally leaves a starter asset after a transient 5xx. Remove only
          # this release's debug APK before each bounded retry so duplicate names cannot block recovery.
          uploaded=false
          for attempt in 1 2 3; do
            assets=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/releases/$release_id/assets")
            asset_id=$(printf '%s' "$assets" | python3 -c 'import json,sys; xs=json.load(sys.stdin); print(next((x["id"] for x in xs if x.get("name")=="app-debug.apk"), ""))')
            if [ -n "$asset_id" ]; then
              curl --fail-with-body --silent --show-error "${auth[@]}" -X DELETE "$api/releases/assets/$asset_id"
            fi
            if curl --fail-with-body --silent --show-error --max-time 600 \
              -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @app/build/outputs/apk/debug/app-debug.apk \
              "$upload_url?name=app-debug.apk"; then
              uploaded=true
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$uploaded" != true ]; then
            echo "APK release upload failed after bounded retries" >&2
            exit 1
          fi
