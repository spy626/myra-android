name: Apply Memory Recall Cleanup

permissions:
  contents: write

on:
  push:
    branches: ['agent/myra-phase-1']

jobs:
  apply-memory-recall-cleanup:
    if: github.event.head_commit.message == 'Stage memory recall cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/myra-phase-1
          fetch-depth: 0
      - name: Apply verified memory cleanup patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/com/myra/assistant/data/memory/JarvisSimpleMemory.kt)" = "b4bbb3a5f17d84096101463e9f3063700a9f59fb"
          test "$(git hash-object app/src/main/java/com/myra/assistant/ai/GeminiLiveClient.kt)" = "d1363b6f18f68f12d3f1c2c67bb104951fe3f351"
          test "$(git hash-object app/src/main/java/com/myra/assistant/data/memory/LocalFastMemoryLane.kt)" = "bbb9cf844903f98821b6cfec4e6d98a04372a6f1"
          test "$(git hash-object app/src/main/java/com/myra/assistant/service/MyraVoiceService.kt)" = "b71fa9cb5d30ac81d8928ea775885d3af2eb5f90"
          test "$(git hash-object app/src/test/java/com/myra/assistant/data/memory/JarvisSimpleMemoryExtractorTest.kt)" = "c99f832a497aadb170c81526524dd0de560fc5b5"
          test "$(git hash-object app/src/test/java/com/myra/assistant/data/memory/AiriMemorySourceComplianceTest.kt)" = "2875e7e88d4509324610b3919b0a507207e1b35c"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/memory-cleanup.patch
          git apply --check /tmp/memory-cleanup.patch
          git apply /tmp/memory-cleanup.patch
          rm -f .github/workflows/apply-memory-recall-cleanup.yml
          git diff --check
          grep -q 'canonicalPreference("sorta ansara")' app/src/test/java/com/myra/assistant/data/memory/JarvisMemoryCanonicalizerTest.kt
          ! grep -q '\.put(memoryQueryDeclaration())' app/src/main/java/com/myra/assistant/ai/GeminiLiveClient.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce memory recall latency and clean noisy memories"
          git push origin HEAD:agent/myra-phase-1
