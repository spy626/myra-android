name: Video Studio Slice 24 Real 18s Three-Shot Construction Gate

on:
  push:
    branches: ['agent/lyra-video-studio-slice-24']
    paths:
      - 'tools/video_studio/**'
      - '.github/workflows/video-studio-slice-24.yml'
  pull_request:
    branches: ['agent/lyra-video-studio-slice-23']

permissions:
  contents: read

jobs:
  real-eighteen-second-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GH_TOKEN: ''
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve all inherited offline security and Android-to-Blender contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/video_studio -p 'test_*.py' -v
          node --test connector-broker/test/video-*.test.mjs
          python3 tools/video_studio/check_staging_readiness.py
          git diff --exit-code acc3c6e15454c35bffae72c18b939d86db5cfb41 HEAD -- \
            connector-broker/src/index.js connector-broker/wrangler.toml \
            connector-broker/wrangler.video-auth.example.toml \
            tools/video_studio/mini_house_blender.py \
            tools/video_studio/render_foundation_shot_blender.py \
            tools/video_studio/render_structure_shot_blender.py \
            tools/video_studio/assemble_construction_sequence.py
      - name: Install free, offline software Blender and FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            blender ffmpeg libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libopengl0 xvfb xauth
          blender --version | head -n 2
      - name: Render 72 genuinely new foundation frames
        run: |
          set -euo pipefail
          o=build/video-studio/slice24/foundation
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_foundation_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/foundation_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/foundation_shot_6s.mp4"
          python3 tools/video_studio/verify_foundation_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$o"
      - name: Render 72 other structural-frame scenes
        run: |
          set -euo pipefail
          o=build/video-studio/slice24/structure
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_structure_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/structure_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/structure_shot_6s.mp4"
          python3 tools/video_studio/verify_structure_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$o"
      - name: Render third NEW walls roof and facade scene
        run: |
          set -euo pipefail
          o=build/video-studio/slice24/facade
          mkdir -p "$o/frames"
          timeout 700 xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --factory-startup --python tools/video_studio/render_facade_shot_blender.py \
            -- --request tools/video_studio/requests/sample-blue-house.json --output-dir "$o"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 12 -start_number 1 \
            -i "$o/frames/facade_%04d.png" -frames:v 72 \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast -movflags +faststart \
            "$o/facade_shot_6s.mp4"
          python3 tools/video_studio/verify_facade_shot.py \
            tools/video_studio/requests/sample-blue-house.json "$o"
      - name: Assemble 18s MP4, compare all 216 decoded frames to sources
        run: |
          set -euo pipefail
          base=build/video-studio/slice24
          python3 tools/video_studio/assemble_three_shot_sequence.py \
            --request tools/video_studio/requests/sample-blue-house.json \
            --foundation-dir "$base/foundation" \
            --structure-dir "$base/structure" \
            --facade-dir "$base/facade" \
            --output-dir "$base/sequence"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "$base/sequence/construction_sequence_18s.mp4" \
            -vf "select='eq(n,0)+eq(n,71)+eq(n,72)+eq(n,143)+eq(n,144)+eq(n,215)',scale=180:320,tile=6x1" \
            -frames:v 1 "$base/sequence/construction_sequence_contact_sheet.png"
          test -s "$base/sequence/construction_sequence_contact_sheet.png"
      - name: Upload real 18s video, facade Blender source and metadata for review
        uses: actions/upload-artifact@v4
        with:
          name: lyra-slice24-real-three-shot-construction-18s
          path: |
            build/video-studio/slice24/sequence/construction_sequence_18s.mp4
            build/video-studio/slice24/sequence/construction_sequence_18s_manifest.json
            build/video-studio/slice24/sequence/construction_sequence_contact_sheet.png
            build/video-studio/slice24/facade/facade_scene.blend
            build/video-studio/slice24/facade/facade_shot_6s.mp4
            build/video-studio/slice24/facade/facade_manifest.json
          if-no-files-found: error
          retention-days: 7
