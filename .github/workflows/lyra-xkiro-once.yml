name: LYRA xKiro scoped integration once
on:
  push:
    branches: ['agent/myra-phase-1']
    paths: ['.github/workflows/lyra-xkiro-once.yml']
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/myra-phase-1'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact branch, preserved recovery and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/myra-phase-1'
          git merge-base --is-ancestor edeb97e368d0948346716034ca32d1afbbd24629 HEAD
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          git diff --exit-code
          git diff --cached --exit-code
          test -f tools/lyra_xkiro_once.py
      - name: Apply guarded Work-only xKiro source changes
        run: |
          set -euo pipefail
          python3 tools/lyra_xkiro_once.py
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure existing signing when secrets exist
        env:
          LYRA_KEYSTORE_BASE64: ${{ secrets.LYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYRA_KEYSTORE_BASE64" ]; then
            echo "$LYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyra-ci.jks"
          fi
      - name: Full unit tests and debug APK before any code commit
        env:
          LYRA_KEYSTORE_PATH: ${{ runner.temp }}/lyra-ci.jks
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/xkiro-gradle.log" 2>&1; then
            tail -n 400 "$RUNNER_TEMP/xkiro-gradle.log"
            exit 1
          fi
          tail -n 60 "$RUNNER_TEMP/xkiro-gradle.log"
      - name: Commit tested bytes only to agent branch; remove one-shot staging
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/lyra_xkiro_once.py .github/workflows/lyra-xkiro-once.yml
          git add app/src/main/java/com/myra/assistant/ai/ApiKeyStore.kt \
            app/src/main/java/com/myra/assistant/ui/settings/ApiCloudSettingsActivity.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteRoute.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatCodingFlow.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceXKiroFree.kt \
            app/src/main/res/layout/activity_api_cloud_settings.xml \
            app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceXKiroFreeTest.kt \
            docs/WORKSPACE_XKIRO_FREE_AUDIT_2026-09-21.md
          git diff --cached --check
          git config user.name 'LYRA CI scoped integrator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(workspace): opt-in verified-free xKiro Work coding with compact privacy settings'
          git push origin HEAD:refs/heads/agent/myra-phase-1
          echo "Integrated branch HEAD: $(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-xkiro-tested-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Dispatch ordinary Android CI on integrated branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref agent/myra-phase-1
