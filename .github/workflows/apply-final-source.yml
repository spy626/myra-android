name: Apply Final LYRA Source

permissions:
  contents: write

on:
  push:
    branches: ['agent/myra-phase-1']

jobs:
  apply-final-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/myra-phase-1
          fetch-depth: 0

      - name: Apply exact uploaded-source patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="60fa0a98c537c7a1927aed11f0dab45942019dfb"
          cat .github/lyra-replace/part-* > "$RUNNER_TEMP/final.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/final.patch.gz.b64" > "$RUNNER_TEMP/final.patch.gz"
          gunzip -c "$RUNNER_TEMP/final.patch.gz" > "$RUNNER_TEMP/final.patch"
          git apply --check "$RUNNER_TEMP/final.patch"
          git apply "$RUNNER_TEMP/final.patch"

          rm -rf .github/lyra-replace
          rm -f .github/workflows/apply-final-source.yml

          expected="$(printf '%s\n' \
            'app/src/main/java/com/myra/assistant/data/memory/AiriMemoryCoordinator.kt' \
            'app/src/main/java/com/myra/assistant/data/memory/AiriMemoryRuntime.kt' \
            'app/src/main/java/com/myra/assistant/data/memory/JarvisSimpleMemory.kt' \
            'app/src/main/java/com/myra/assistant/data/memory/LocalFastMemoryLane.kt' \
            'app/src/main/java/com/myra/assistant/screen/ScreenVisionIntent.kt' \
            'app/src/main/java/com/myra/assistant/service/AccessibilityHelperService.kt' \
            'app/src/main/java/com/myra/assistant/service/MyraVoiceService.kt' \
            'app/src/main/java/com/myra/assistant/service/WhatsAppNotificationService.kt' | sort)"
          actual="$(git diff --name-only "$BASE_SHA" -- | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected final source diff"
            echo "EXPECTED:"
            printf '%s\n' "$expected"
            echo "ACTUAL:"
            printf '%s\n' "$actual"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Click WhatsApp and memory fixes"
          git push origin HEAD:agent/myra-phase-1
