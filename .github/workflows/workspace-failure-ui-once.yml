          intent = root / 'WorkspaceChatIntent.kt'
          tests = Path('app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceChatIntentTest.kt')

          def apply(path, changes):
              text = path.read_text()
              for old, new in changes:
                  if text.count(old) != 1:
                      raise RuntimeError(f'{path}: expected one matching patch anchor, found {text.count(old)}: {old[:90]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

