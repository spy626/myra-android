name: One-time Workspace failure UI patch
on:
  push:
    branches: ['agent/myra-phase-1']
    paths: ['.github/workflows/workspace-failure-ui-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply exact Workspace-only patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/myra-phase-1'
          python3 scripts/workspace_failure_ui_once.py
          git diff --check
      - name: Verify unit tests and APK before committing
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Commit only verified Workspace changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceActivity.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatIntent.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceChatIntentTest.kt
          git commit -m 'fix(workspace): show failures by composer and offer guarded retry'
          git push origin HEAD:agent/myra-phase-1
