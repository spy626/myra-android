name: LYRA Natural Chat Isolated Test
on:
  push:
    branches: [agent/myra-phase-1]
    paths:
      - .github/workflows/lyra-natural-chat-isolated.yml
permissions:
  contents: read
jobs:
  isolated-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source and feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/myra-phase-1'
          git merge-base --is-ancestor 786a0eed9a95756e08d0c15270bc2e4d22b6c898 HEAD
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Isolate test package without modifying feature source or old phone data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle')
          source = gradle.read_text()
          before = 'applicationId "com.myra.assistant"'
          assert source.count(before) == 1, 'Unexpected application ID; refusing to modify'
          gradle.write_text(source.replace(before, 'applicationId "com.myra.assistant.chatpreview"', 1))
          manifest = Path('app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          original = 'android:label="LYRA"'
          assert xml.count(original) == 1, 'Unexpected app label; refusing to modify'
          manifest.write_text(xml.replace(original, 'android:label="LYRA Chat Test"', 1))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
      - name: Run all unit tests and build isolated Android APK
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon > "$RUNNER_TEMP/isolated-chat.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/isolated-chat.log"; exit 1; }
          tail -n 30 "$RUNNER_TEMP/isolated-chat.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'Source branch was not changed by isolated APK build.'
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-natural-chat-side-by-side-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
