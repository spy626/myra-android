name: LYRA Cloudflare Complete Removal One-Off
on:
  push:
    branches: [agent/myra-phase-1]
    paths: ['.github/workflows/lyra-cloudflare-remove-once.yml']
permissions:
  contents: write
jobs:
  remove-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/myra-phase-1
          fetch-depth: 0
      - name: Apply exact guarded source and test removal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/myra-phase-1'
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          python3 - <<'PY'
          import base64, hashlib, zlib
          # Ephemeral compressed copy of a reviewed, exact-match 235-line Python
          # patch script. The one-off workflow removes itself after passing CI.
          encoded = '' 
          payload = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == 'f5b3aa47fb03af8ab40e6578d4b989128da2974a634df6cf82305a0de7335135'
          exec(compile(payload, 'remove_cloudflare_once.py', 'exec'))
          PY
          git diff --check
          git status --short
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure stable APK signing when secrets exist
        env:
          LYRA_KEYSTORE_BASE64: ${{ secrets.LYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYRA_KEYSTORE_BASE64" ]; then
            echo "$LYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyra-ci.jks"
          fi
      - name: Unit tests and APK build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
        env:
          LYRA_KEYSTORE_PATH: ${{ runner.temp }}/lyra-ci.jks
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-cloudflare-removed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit tested change on feature branch only; delete one-off workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lyra-cloudflare-removal-audit-once.yml .github/workflows/lyra-cloudflare-remove-once.yml
          git add app/src/main app/src/test
          git diff --cached --check
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workspace): remove Cloudflare AI provider and retire old credentials'
          git push origin HEAD:agent/myra-phase-1
