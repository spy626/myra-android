name: Apply context-aware memory patch

on:
  push:
    branches:
      - agent/myra-phase-1
    paths:
      - '.memory_patch/**'
      - '.github/workflows/apply-context-memory.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/myra-phase-1
          fetch-depth: 0
      - name: Rebuild and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .memory_patch/part-* > /tmp/context-memory.patch
          echo '2c4a67e348e64d008d9617af3cbe982926e802a64bcdeb261f3d32cb69b90089  /tmp/context-memory.patch' | sha256sum -c -
          git apply --check /tmp/context-memory.patch
          git apply /tmp/context-memory.patch
          rm -rf .memory_patch
          rm -f .github/workflows/apply-context-memory.yml
          git diff --check
      - name: Commit human-context memory implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add context-aware human memory admission'
          git push origin HEAD:agent/myra-phase-1
