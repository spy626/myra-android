name: LYRA Chat Reply Safety Verify
on:
  push:
    branches: [agent/myra-phase-1]
    paths: [.github/workflows/lyra-chat-reply-safety.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch and recovery ancestor
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/myra-phase-1"
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply bounded response checks and validate diff
        run: |
          set -euo pipefail
          python3 tools/apply_chat_safety.py
          git diff --check
      - name: Test entire Android project and assemble APK
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/build.log" 2>&1 || {
            tail -n 220 "$RUNNER_TEMP/build.log"; exit 1;
          }
          tail -n 55 "$RUNNER_TEMP/build.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit tested source only to approved branch
        run: |
          set -euo pipefail
          git config user.name 'LYRA scoped CI verification'
          git config user.email 'lyra-ci@users.noreply.github.com'
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatVisibleReply.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatPlanStatus.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatTurnFrame.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceActivity.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatGateway.kt \
            app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceChatResponseSafetyTest.kt
          git diff --cached --check
          git commit -m 'fix(chat): block reasoning leaks and ground cancelled-plan status'
          git push origin HEAD:refs/heads/agent/myra-phase-1
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-chat-response-safety-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
