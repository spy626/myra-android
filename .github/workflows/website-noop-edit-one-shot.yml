name: LYRA Existing Website Edit No-op Verify
on:
  push:
    branches: [agent/myra-phase-1]
    paths:
      - .github/workflows/website-noop-edit-one-shot.yml
      - .github/scripts/website_noop_edit_ci.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required feature branch and recovery history
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/myra-phase-1"
          git merge-base --is-ancestor 736922376e3efbdc122c56f2634045b8e48bfc75 HEAD
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply anchored generic change guard and regression tests
        run: |
          set -euo pipefail
          python3 .github/scripts/website_noop_edit_ci.py
          git add -N app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteNoOpEditTest.kt
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 4
      - name: Run every unit test and build regular LYRA debug APK
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon > "$RUNNER_TEMP/website-noop-edit.log" 2>&1 || { tail -n 180 "$RUNNER_TEMP/website-noop-edit.log"; exit 1; }
          tail -n 35 "$RUNNER_TEMP/website-noop-edit.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit only verified changes to feature branch
        run: |
          set -euo pipefail
          git config user.name 'LYRA scoped CI verification'
          git config user.email 'lyra-ci@users.noreply.github.com'
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteGeneration.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteVisualQuality.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatCodingFlow.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteNoOpEditTest.kt
          git commit -m 'fix(workspace): reject unchanged website edits before save and strengthen change instructions'
          git push origin HEAD:refs/heads/agent/myra-phase-1
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-website-edit-noop-guard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
