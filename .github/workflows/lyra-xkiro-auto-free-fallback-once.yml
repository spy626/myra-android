name: LYRA xKiro optional free coding fallback once
on:
  push:
    branches: ['agent/myra-phase-1']
    paths: ['.github/workflows/lyra-xkiro-auto-free-fallback-once.yml']
permissions:
  contents: write
  actions: write
jobs:
  integrate-and-isolate:
    if: github.ref == 'refs/heads/agent/myra-phase-1'
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify branch, recovery ancestry and staged script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = agent/myra-phase-1
          git merge-base --is-ancestor a9eb168bf240e34c9ef6ff7ac5f7cdce25b49de2 HEAD
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          git diff --exit-code
          git diff --cached --exit-code
          test -f tools/lyra_xkiro_fallback_once.py
      - name: Apply strict source edits, never touch main
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/lyra_xkiro_fallback_once.py
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Full unit tests and standard debug compile before commit
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/fallback-gradle.log" 2>&1; then
            tail -n 350 "$RUNNER_TEMP/fallback-gradle.log"
            exit 1
          fi
          tail -n 55 "$RUNNER_TEMP/fallback-gradle.log"
      - name: Commit tested sources only on agent branch
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/lyra_xkiro_fallback_once.py .github/workflows/lyra-xkiro-auto-free-fallback-once.yml
          git add app/src/main/java/com/myra/assistant/ui/settings/ApiCloudSettingsActivity.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatCodingFlow.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceXKiroFree.kt \
            app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceCodingAutoFallback.kt \
            app/src/main/res/layout/activity_api_cloud_settings.xml \
            app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceCodingAutoFallbackTest.kt \
            docs/WORKSPACE_XKIRO_AUTOMATIC_FREE_FALLBACK_2026-09-21.md
          git diff --cached --check
          git config user.name 'LYRA CI scoped integrator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(workspace): consented xKiro to free-only coding fallback'
          git push origin HEAD:refs/heads/agent/myra-phase-1
          echo "Integrated source: $(git rev-parse HEAD)"
      - name: Change Android package only in runner for separate safe phone test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('app/build.gradle')
          src=gradle.read_text()
          old="debug { if (hasStableSigning) signingConfig signingConfigs.ciStable }"
          assert src.count(old)==1, 'Unknown signing/build configuration'
          gradle.write_text(src.replace(old,"debug { applicationIdSuffix '.freefallbacktest'; if (hasStableSigning) signingConfig signingConfigs.ciStable }"))
          manifest=Path('app/src/main/AndroidManifest.xml')
          src=manifest.read_text()
          old='android:label="LYRA"'
          assert src.count(old)==1, 'Unknown app label'
          manifest.write_text(src.replace(old,'android:label="LYRA Free Fallback Test"'))
          PY
          git diff --check
      - name: Build isolated debug APK with unit tests
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/fallback-isolated-gradle.log" 2>&1; then
            tail -n 350 "$RUNNER_TEMP/fallback-isolated-gradle.log"
            exit 1
          fi
          tail -n 45 "$RUNNER_TEMP/fallback-isolated-gradle.log"
      - name: Verify isolated identity and hash
        shell: bash
        run: |
          set -euo pipefail
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$aapt"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/fallback-badging.txt" | head -n 18
          grep -q "package: name='com.myra.assistant.freefallbacktest'" "$RUNNER_TEMP/fallback-badging.txt"
          grep -q "application-label:'LYRA Free Fallback Test'" "$RUNNER_TEMP/fallback-badging.txt"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-xkiro-free-fallback-isolated-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Dispatch ordinary Android CI on integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref agent/myra-phase-1