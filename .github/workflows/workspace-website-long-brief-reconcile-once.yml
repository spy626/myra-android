name: Website full-brief reconciled CI
on:
  push:
    branches: [agent/myra-phase-1]
    paths: [.github/workflows/workspace-website-long-brief-reconcile-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'spy626/myra-android' && github.ref == 'refs/heads/agent/myra-phase-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Exact branch and staged regression reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/myra-phase-1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/myra-phase-1)"
          python3 -m py_compile scripts/workspace_website_long_brief_once.py scripts/workspace_website_long_brief_reconcile_once.py
          python3 scripts/workspace_website_long_brief_reconcile_once.py
          git diff --check
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceTaskContract.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceTaskStore.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceTaskActivity.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatCodingFlow.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteGeneration.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteGroqFallback.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceAiHandoff.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteLongBriefTest.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteGroqFallbackTest.kt
          test -n "$(git diff --cached --name-only)"
      - name: Unit tests and debug compile
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Fast-forward only the tested agent branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/myra-phase-1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/myra-phase-1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workspace): allow long website briefs without truncation or legacy regressions'
          git push origin HEAD:agent/myra-phase-1
