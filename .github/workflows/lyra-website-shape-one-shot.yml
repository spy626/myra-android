name: LYRA Three File Shape Recovery Test
on:
  push:
    branches: [agent/myra-phase-1]
    paths:
      - .github/workflows/lyra-website-shape-one-shot.yml
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify feature branch and protected ancestors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = agent/myra-phase-1
          git merge-base --is-ancestor ef62fc17ef747ae5dc189e7d30e71fdfccc16900 HEAD
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          git merge-base --is-ancestor 74f603cd2f19bf9435e20020486d9f22d061474f HEAD
          git diff --exit-code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply audited parser and regression tests on CI runner
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/website_shape_ci.py
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git ls-files --others --exclude-standard | wc -l)" -eq 2
      - name: Test full unit suite and build regular APK before commit
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon > "$RUNNER_TEMP/verify.log" 2>&1 || { tail -n 180 "$RUNNER_TEMP/verify.log"; exit 1; }
          tail -n 35 "$RUNNER_TEMP/verify.log"
      - name: Commit only verified parser and tests to feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = agent/myra-phase-1
          git diff --check
          git config user.name 'LYRA CI parser verification'
          git config user.email 'lyra-ci@users.noreply.github.com'
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteGeneration.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteReplyShape.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteReplyShapeTest.kt
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix(workspace): validate exact direct and array three-file replies'
          git push origin HEAD:refs/heads/agent/myra-phase-1
      - name: Isolate phone APK identity on CI runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build=Path('app/build.gradle'); s=build.read_text()
          old='debug { if (hasStableSigning) signingConfig signingConfigs.ciStable }'
          assert s.count(old)==1
          build.write_text(s.replace(old,"debug { applicationIdSuffix '.shapecheck'; if (hasStableSigning) signingConfig signingConfigs.ciStable }",1))
          manifest=Path('app/src/main/AndroidManifest.xml'); s=manifest.read_text()
          old='android:label="LYRA"'
          assert s.count(old)==1
          manifest.write_text(s.replace(old, 'android:label="LYRA Shape Test"',1))
          PY
          git diff --check
      - name: Build isolated APK and verify distinct identity
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon > "$RUNNER_TEMP/apk.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/apk.log"; exit 1; }
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.myra.assistant.shapecheck'" "$RUNNER_TEMP/badging.txt"
          grep -q "application-label:'LYRA Shape Test'" "$RUNNER_TEMP/badging.txt"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          tail -n 10 "$RUNNER_TEMP/apk.log"
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-website-shape-isolated-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
