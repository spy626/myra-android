name: Video Studio Slice 11 OAuth Staging Contract

on:
  push:
    branches: ['agent/lyra-video-studio-slice-11']
    paths:
      - 'connector-broker/src/video-*.mjs'
      - 'connector-broker/test/video-*.test.mjs'
      - 'connector-broker/wrangler.video-auth.example.toml'
      - '.github/workflows/video-studio-slice-11.yml'
      - 'tools/video_studio/SLICE_11.md'
  pull_request:
    branches: ['agent/lyra-video-studio-slice-10']
    paths:
      - 'connector-broker/src/video-*.mjs'
      - 'connector-broker/test/video-*.test.mjs'
      - 'connector-broker/wrangler.video-auth.example.toml'
      - '.github/workflows/video-studio-slice-11.yml'
      - 'tools/video_studio/SLICE_11.md'

permissions:
  contents: read

jobs:
  staged-oauth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check Node server and test source syntax
        run: |
          node --version
          for file in connector-broker/src/video-*.mjs connector-broker/test/video-*.test.mjs; do
            node --check "$file"
          done
      - name: Test PKCE S256, encrypted vault, session binding and fail-closed routes
        run: |
          node --test connector-broker/test/video-*.test.mjs
      - name: Verify six-field Python render contract stays unchanged
        run: |
          python3 -m unittest discover -s tools/video_studio -p 'test_*.py' -v
      - name: Confirm staging disabled and production connector unchanged
        run: |
          grep -F 'VIDEO_AUTH_ENABLED = "false"' connector-broker/wrangler.video-auth.example.toml
          grep -F 'VIDEO_AUTH_DEPLOYMENT_APPROVED = "false"' connector-broker/wrangler.video-auth.example.toml
          grep -F 'new_sqlite_classes = ["VideoOAuthVault", "VideoRenderOwnerDurableObject"]' connector-broker/wrangler.video-auth.example.toml
          git diff --exit-code HEAD~1 -- connector-broker/src/index.js connector-broker/wrangler.toml
