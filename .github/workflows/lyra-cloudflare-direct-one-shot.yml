name: LYRA Cloudflare Direct Regular APK
on:
  push:
    branches: [agent/myra-phase-1]
    paths:
      - .github/workflows/lyra-cloudflare-direct-one-shot.yml
      - app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceChatGatewayTest.kt
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Check branch and recovery ancestry
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/myra-phase-1"
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          git merge-base --is-ancestor 74f603cd2f19bf9435e20020486d9f22d061474f HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare normal LYRA stable signing if configured
        env:
          LYRA_KEYSTORE_BASE64: ${{ secrets.LYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYRA_KEYSTORE_BASE64" ]; then
            echo "$LYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyra-ci.jks"
            echo "Stable signing configured"
          else
            echo "No stable signing secret: debug APK may not update an existing install"
          fi
      - name: Apply scoped Cloudflare change on CI runner
        run: |
          set -euo pipefail
          python3 .github/scripts/cloudflare_direct_ci.py
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 8
      - name: Run all unit tests and build REGULAR app APK before commit
        env:
          LYRA_KEYSTORE_PATH: ${{ runner.temp }}/lyra-ci.jks
          LYRA_KEYSTORE_PASSWORD: ${{ secrets.LYRA_KEYSTORE_PASSWORD }}
          LYRA_KEY_ALIAS: ${{ secrets.LYRA_KEY_ALIAS }}
          LYRA_KEY_PASSWORD: ${{ secrets.LYRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/lyra-cloudflare-gradle.log" 2>&1 || { tail -n 220 "$RUNNER_TEMP/lyra-cloudflare-gradle.log"; exit 1; }
          tail -n 40 "$RUNNER_TEMP/lyra-cloudflare-gradle.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit verified change to feature branch only
        run: |
          set -euo pipefail
          git config user.name "LYRA CI Cloudflare verification"
          git config user.email "lyra-ci@users.noreply.github.com"
          git add app/src/main/java/com/myra/assistant/ai/ApiKeyStore.kt app/src/main/java/com/myra/assistant/ui/settings/ApiCloudSettingsActivity.kt app/src/main/res/layout/activity_api_cloud_settings.xml app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatGateway.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceActivity.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceWebsiteRoute.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceChatCodingFlow.kt app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceCloudflareFree.kt
          git commit -m "feat(workspace): select Cloudflare Free directly for chat and coding"
          git push origin HEAD:refs/heads/agent/myra-phase-1
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-cloudflare-direct-regular-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
