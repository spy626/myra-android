name: LYRA Cloudflare Website SSE Envelope Verify
on:
  push:
    branches: [agent/myra-phase-1]
    paths:
      - .github/workflows/cloudflare-website-stream-envelope-one-shot.yml
      - .github/scripts/cloudflare_website_stream_envelope_ci.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify feature branch and recovery ancestry
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/myra-phase-1"
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          git merge-base --is-ancestor 7f46a1d4a46e5f93ef487d94a0c0308c6a72c447 HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply narrow fix and regression cases
        run: |
          set -euo pipefail
          python3 .github/scripts/cloudflare_website_stream_envelope_ci.py
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 2
      - name: All unit tests and regular LYRA debug APK
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon > "$RUNNER_TEMP/lyra-sse-envelope.log" 2>&1 || { tail -n 180 "$RUNNER_TEMP/lyra-sse-envelope.log"; exit 1; }
          tail -n 35 "$RUNNER_TEMP/lyra-sse-envelope.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit tested source and regressions to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'LYRA scoped CI verification'
          git config user.email 'lyra-ci@users.noreply.github.com'
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceCloudflareFree.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceCloudflareModelsWebsiteTest.kt
          git commit -m 'fix(workspace): bound SSE framing separately from complete website output'
          git push origin HEAD:refs/heads/agent/myra-phase-1
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-cloudflare-website-stream-envelope-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
