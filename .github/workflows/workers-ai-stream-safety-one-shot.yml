name: LYRA Cloudflare Stream Safety Verify
on:
  push:
    branches: [agent/myra-phase-1]
    paths:
      - .github/workflows/workers-ai-stream-safety-one-shot.yml
      - .github/scripts/workers_ai_stream_safety_ci.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch and recovery history
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/myra-phase-1"
          git merge-base --is-ancestor c307357b53ec4ad3a005769d55f29bc44d74ff41 HEAD
          git merge-base --is-ancestor 6815c376e7eeedd0f54822789dcda9b7399c21f3 HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply narrow SSE correction and regression tests
        run: |
          set -euo pipefail
          python3 .github/scripts/workers_ai_stream_safety_ci.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceCloudflareModelsWebsiteTest.kt')
          text = p.read_text()
          old = 'val streamed = chunk(raw.substring(0, middle)) + chunk(" ") + chunk(raw.substring(middle)) + end'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'val streamed = chunk(" ") + chunk(raw.substring(0, middle)) + chunk(raw.substring(middle)) + end'))
          PY
          git add -N app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceCloudflareModelsWebsiteTest.kt
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 2
      - name: All unit tests and normal LYRA APK
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon > "$RUNNER_TEMP/lyra-stream.log" 2>&1 || { tail -n 180 "$RUNNER_TEMP/lyra-stream.log"; exit 1; }
          tail -n 40 "$RUNNER_TEMP/lyra-stream.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit tested source and regression cases to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'LYRA scoped CI verification'
          git config user.email 'lyra-ci@users.noreply.github.com'
          git add app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceCloudflareFree.kt app/src/test/java/com/myra/assistant/ui/workspace/WorkspaceCloudflareModelsWebsiteTest.kt
          git commit -m 'fix(workspace): preserve SSE whitespace and require complete Cloudflare website replies'
          git push origin HEAD:refs/heads/agent/myra-phase-1
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-cloudflare-four-models-website-stream-final-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
