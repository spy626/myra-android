              '''            .put("description", "Interpret durable user meaning using the current completed turn together with the recent conversation. Do not propose long-term memory for acknowledgements, chitchat, commands, hypothetical/speculative statements, quoted/reported claims, or fragments whose referent is unclear. A short answer may become memory only when the immediately preceding context makes its subject and meaning unambiguous. Required by intent: ADD/REMOVE_RELATIONSHIP need person+relationship; REPLACE_RELATIONSHIP needs person+replacement_relationship; RENAME_ENTITY needs person+replacement_person; DELETE_ENTITY needs person; ADD_LINKED_FACT needs person+fact; ADD_EPISODE needs event_type+fact and participants when stated; ADD_GOAL needs goal_title. Every operation needs source_span+confidence. source_span copies the shortest near-verbatim current-turn words; fact may express the context-resolved meaning but must not add unsupported details. Put every critical literal in critical_literals. Questions are RECALL. Android performs final context/safety admission and alone owns persistence.")''',
              '''            .put("description", "Interpret durable user meaning using the current completed turn together with the recent conversation. Save atomic meanings, not the whole utterance: one relationship plus one separate person fact must be separate operations. Never emit a duplicate generic ADD_FACT for text already represented by a relationship/episode/goal/preference. If a same-turn clause uses uska/uski/uske/his/her and one person is unambiguous, use ADD_LINKED_FACT for that person. Do not propose long-term memory for acknowledgements, chitchat, commands, hypothetical/speculative statements, quoted/reported claims, or fragments whose referent is unclear. A short answer may become memory only when the immediately preceding context makes its subject and meaning unambiguous. Required by intent: ADD/REMOVE_RELATIONSHIP need person+relationship; REPLACE_RELATIONSHIP needs person+replacement_relationship; RENAME_ENTITY needs person+replacement_person; DELETE_ENTITY needs person; ADD_LINKED_FACT needs person+fact; ADD_EPISODE needs event_type+fact and participants when stated; ADD_GOAL needs goal_title. Every operation needs source_span+confidence. source_span copies the shortest near-verbatim current-turn words; fact may express only the context-resolved meaning and must not add unsupported details. Put every critical literal in critical_literals. Questions are RECALL. Android performs final context/safety admission and alone owns persistence.")'''
