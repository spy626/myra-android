              '''                val recallTurnId = activeTurnId\n                val earlyQueryText = query.ifBlank { lastUserIntentText.ifBlank { input.toString().trim() } }\n                if (recallTurnId != 0L && tryEarlyLocalMemoryRecall(id, "query_user_memory", recallTurnId, earlyQueryText)) {\n                    return\n                }\n                val pendingRecall = if (recallTurnId != 0L) {'''
          )

          sub_once(
              'app/src/main/java/com/myra/assistant/service/MyraVoiceService.kt',
              r'''    private fun handleSemanticMemoryProposal\(id: String, args: org\.json\.JSONObject\) \{.*?\n    \}\n\n    private fun reserveMemoryResponse''',
              '''    private fun handleSemanticMemoryProposal(id: String, args: org.json.JSONObject) {\n        val guardedText = lastUserIntentText.ifBlank { input.toString().trim() }\n        if (guardedText.isBlank()) {\n            live?.sendToolResponse(id, "propose_user_memory", false, "Current turn is unavailable")\n            return\n        }\n        val proposalTurnId = activeTurnId\n        val operations = parseMemorySemanticOperations(args).map { it.copy(sourceTurnId = proposalTurnId) }\n        if (proposalTurnId == 0L || operations.isEmpty()) {\n            live?.sendToolResponse(id, "propose_user_memory", false, "Structured proposal was incomplete")\n            return\n        }\n\n        if (operations.all { it.intent == MemorySemanticIntent.RECALL } &&\n            tryEarlyLocalMemoryRecall(id, "propose_user_memory", proposalTurnId, guardedText)\n        ) return\n\n        val existing = stagedMemorySemantics[proposalTurnId].orEmpty()\n        val merged = StagedMemoryProposalPolicy.merge(existing, operations)\n        stagedMemorySemantics[proposalTurnId] = merged\n\n        val saveLike = merged.isNotEmpty() && merged.all { it.intent in setOf(\n            MemorySemanticIntent.ADD_FACT, MemorySemanticIntent.ADD_RELATIONSHIP,\n            MemorySemanticIntent.ADD_LINKED_FACT, MemorySemanticIntent.ADD_EPISODE,\n            MemorySemanticIntent.ADD_GOAL, MemorySemanticIntent.UPDATE_FACT,\n            MemorySemanticIntent.SUPERSEDE_FACT\n        ) }\n        val explicitMemoryManagement = Regex(\n            "(?i)\\\\b(?:remember|yaad\\\\s+rakh|memory\\\\s+mein|save\\\\s+(?:this|it)|forget|bhool|delete\\\\s+memory|rename)\\\\b"\n        ).containsMatchIn(guardedText)\n\n        if (saveLike && !explicitMemoryManagement) {\n            nonBlockingMemorySaveTurns += proposalTurnId\n            com.myra.assistant.data.memory.JarvisSimpleMemoryRuntime.stageProvisionalUserMemory(\n                transcriptSessionId, proposalTurnId, guardedText\n            )\n            voiceLog(\n                "MEMORY_SEMANTIC_PROPOSAL_STAGED turnId=$proposalTurnId received=${operations.size} " +\n                    "merged=${merged.size} decision=NON_BLOCKING_FINAL_VALIDATE executed=false"\n            )\n            live?.sendToolResponse(\n                id, "propose_user_memory", true,\n                "Memory meaning is staged locally; continue the natural reply while Android validates the final turn"\n            )\n            return\n        }\n\n        reserveMemoryResponse(proposalTurnId, "SEMANTIC_PROPOSAL")\n        voiceLog(\n            "MEMORY_SEMANTIC_PROPOSAL_STAGED turnId=$proposalTurnId received=${operations.size} " +\n                "merged=${merged.size} decision=WAIT_FOR_FINAL executed=false"\n        )\n        live?.sendToolHeld(id, "propose_user_memory")\n    }\n\n    private fun tryEarlyLocalMemoryRecall(\n        id: String,\n        functionName: String,\n        turnId: Long,\n        queryText: String\n    ): Boolean {\n        val clean = queryText.trim()\n        if (turnId == 0L || clean.length < 3) return false\n        val evidence = com.myra.assistant.data.memory.AuthoritativeMemoryTurnEvidence(\n            turnId = turnId,\n            canonicalText = clean,\n            displayText = romanDisplayText(clean),\n            sessionId = transcriptSessionId,\n            utteranceId = "$transcriptSessionId:early:$turnId",\n            contextGeneration = turnId\n        )\n        val localIntent = com.myra.assistant.data.memory.LocalMemoryRecallRouter.classify(evidence) ?: return false\n        if (!earlyMemoryRecallTurns.add(turnId)) {\n            live?.sendToolResponse(id, functionName, true, "Local memory recall is already handling this turn")\n            return true\n        }\n        reserveMemoryResponse(turnId, "EARLY_LOCAL_RECALL")\n        live?.sendToolResponse(id, functionName, true, "Android local memory recall is handling this turn")\n        val started = android.os.SystemClock.elapsedRealtime()\n        serviceScope.launch {\n            val execution = fastMemoryLane.recall(evidence)\n            if (execution == null) {\n                earlyMemoryRecallTurns.remove(turnId)\n                return@launch\n            }\n            val outcome = execution.outcome\n            val response = verifiedMemoryResponse(outcome, "")\n            memoryBrain.captureConversation(evidence, response)\n            mainHandler.post {\n                val queuedAt = android.os.SystemClock.elapsedRealtime()\n                voiceLog(\n                    "MEMORY_FAST_LANE_EARLY turnId=$turnId queryType=${execution.intent.type} " +\n                        "retrievalDurationMs=${outcome.durationMs} semanticToolToReplyQueuedMs=${queuedAt - started} networkCall=false"\n                )\n                listener?.onMyraText(response)\n                emitState(response)\n                queueLocalSpeech(\n                    response, allowUntranscribedAudio = true,\n                    validationPolicy = LocalSpeechValidationPolicy.MEMORY\n                )\n            }\n        }\n        return true\n    }\n\n    private fun reserveMemoryResponse'''
