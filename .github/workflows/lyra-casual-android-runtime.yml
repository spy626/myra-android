name: LYRA Android Casual Reply Runtime Regression
on:
  push:
    branches: ['agent/myra-phase-1']
    paths:
      - '.github/workflows/lyra-casual-android-runtime.yml'
      - 'app/src/androidTest/java/com/myra/assistant/ui/workspace/WorkspaceCasualReplyEvidenceAndroidTest.kt'
      - 'app/src/main/java/com/myra/assistant/ui/workspace/WorkspaceCasualReplyEvidence.kt'
      - 'app/build.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo 'No /dev/kvm: emulator may be slow'; fi
      - name: Execute on Android regex engine
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
